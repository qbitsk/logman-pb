# HTTPS variant of logman.conf. Install to /etc/nginx/sites-available/logman
# (README → Self-hosted Deployment → HTTPS with Let's Encrypt (DNS-01)).
#
# The certificate is issued by certbot with a DNS-01 challenge into
# /etc/letsencrypt/live/produkcia.logman-povazan.com/; certbot reloads nginx after each renewal
# through the deploy hook saved at issue time.

# Plain HTTP on any host → HTTPS on the canonical hostname. Port 80 is kept
# only for these redirects (old bookmarks, terminals); DNS-01 doesn't need it.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://produkcia.logman-povazan.com$request_uri;
}

# HTTPS on any other Host (e.g. the bare IP) → canonical hostname. Better Auth
# only trusts the origin in NEXT_PUBLIC_APP_URL, so logins must happen there.
# (The browser warns first: the certificate doesn't cover the IP.)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/produkcia.logman-povazan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/produkcia.logman-povazan.com/privkey.pem;

    return 301 https://produkcia.logman-povazan.com$request_uri;
}

server {
    listen 443 ssl http2;   # nginx 1.24 (Ubuntu 24.04) syntax
    listen [::]:443 ssl http2;
    server_name produkcia.logman-povazan.com;

    ssl_certificate     /etc/letsencrypt/live/produkcia.logman-povazan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/produkcia.logman-povazan.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Uncomment once HTTPS has run fine through at least one renewal: browsers
    # then refuse plain HTTP for a year, so an expired certificate locks users
    # out instead of falling back.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Required for Next.js streaming responses
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
