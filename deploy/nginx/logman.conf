# Installed by bootstrap.sh to /etc/nginx/sites-available/logman with
# __APP_HOST__ replaced by the canonical hostname.
#
# Adding TLS later: obtain a certificate, add a `listen 443 ssl` server block
# with the same `location /`, turn the port-80 blocks into redirects to
# https://__APP_HOST__, and switch BETTER_AUTH_URL / NEXT_PUBLIC_APP_URL to https.

# Any other Host (e.g. the bare IP) → canonical hostname. Better Auth only
# trusts the origin in NEXT_PUBLIC_APP_URL, so logins must happen there.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 http://__APP_HOST__$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name __APP_HOST__;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Required for Next.js streaming responses
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
