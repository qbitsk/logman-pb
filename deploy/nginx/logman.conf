# Install to /etc/nginx/sites-available/logman (README → Self-hosted Deployment, step 12).
#
# Plain HTTP only. For HTTPS, use logman-tls.conf instead (README → Self-hosted
# Deployment → HTTPS with Let's Encrypt (DNS-01)).

# Any other Host (e.g. the bare IP) → canonical hostname. Better Auth only
# trusts the origin in NEXT_PUBLIC_APP_URL, so logins must happen there.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 http://produkcia.logman-povazan.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name produkcia.logman-povazan.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Required for Next.js streaming responses
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
